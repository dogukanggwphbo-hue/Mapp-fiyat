name: Fiyat güncelle

on:
  schedule:
    # Günde 2 tur: sabah 10:30 ve akşamüstü 16:30 (Türkiye). Tur birkaç dakika sürdüğü ve GitHub zamanlayıcısı geç başlatabildiği için
    # tur 5 dakika ÖNCE başlar (10:25 / 16:25): veri 10:30 / 16:30'da güncel olur. (UTC = Türkiye - 3 saat)
    # Her turun 30 dakika sonrasına YEDEK tur konur. Yedek tur, son 3 saatte başarılı tur varsa kendiliğinden atlanır (kredi harcamaz);
    # asıl tur çalışmadıysa ya da başarısız olduysa onun yerine çalışır. Ayrıca GitHub'dan bağımsız bir zamanlanmış görev de aynı saatlerde bu iş akışını başlatır.
    - cron: '25 7 * * *'   # 10:25 (Türkiye) -> sabah turu
    - cron: '55 7 * * *'   # 10:55 yedek
    - cron: '25 13 * * *'  # 16:25 (Türkiye) -> akşamüstü turu
    - cron: '55 13 * * *'  # 16:55 yedek
  workflow_dispatch:
    inputs:
      force:
        description: 'Deneme turu: günlük sınırı yoksay (kredi harcar, ama sabah/akşamüstü turlarının hakkından düşmez)'
        type: boolean
        default: false
      dry:
        description: 'Kuru tur: hiçbir sorgu yapmaz, kredi harcamaz; yalnızca tur çalışır mı ve hangi anahtar sırasıyla çalışırdı onu gösterir'
        type: boolean
        default: false
      key_slot:
        description: 'Anahtar: auto = normal sıra (1 → 2 → … → 6 sırayla); 2-6 = yalnızca o anahtarla dene (yedeğe geçilmez)'
        type: choice
        options: [auto, '2', '3', '4', '5', '6']
        default: auto

permissions:
  contents: write
  actions: write   # zamanlayıcının 60 gün hareketsizlikten kapanmasını önlemek için (aşağıdaki 'Canlı tut' adımı)

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Her zaman main'in EN GÜNCEL hali: aynı anda sıraya girmiş iki tur olsa bile ikincisi, birincinin kaydettiği tur kaydını görür ve gereksiz kredi harcamaz.
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testler
        run: node --test "test/*.test.mjs"
      - name: Fiyatları topla
        env:
          REEFAPI_KEY: ${{ secrets.REEFAPI_KEY }}
          REEFAPI_KEY_2: ${{ secrets.REEFAPI_KEY_2 }}   # isteğe bağlı yedek anahtarlar: ilki biterse/geçersizse otomatik devreye girer
          REEFAPI_KEY_3: ${{ secrets.REEFAPI_KEY_3 }}
          REEFAPI_KEY_4: ${{ secrets.REEFAPI_KEY_4 }}
          REEFAPI_KEY_5: ${{ secrets.REEFAPI_KEY_5 }}
          REEFAPI_KEY_6: ${{ secrets.REEFAPI_KEY_6 }}
          REEFAPI_ONLY: ${{ inputs.key_slot == 'auto' && '' || inputs.key_slot }}
        run: node collect.mjs ${{ inputs.force && '--force' || '' }} ${{ inputs.dry && '--dry' || '' }}
      - name: Kaydet
        if: always()
        run: |
          git config user.name "mapp-fiyat-bot"
          git config user.email "mapp-fiyat-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "Fiyatlar güncellendi" && { git push || { git pull --rebase -X theirs && git push; }; }; }
      - name: Zamanlayıcıyı canlı tut
        # GitHub, herkese açık depoda 60 gün etkinlik olmazsa zamanlanmış çalışmaları kapatır.
        # Bu adım her turda iş akışını "etkinleştir" API'siyle yeniler; sayaç sıfırlanır. Başarısız olsa bile tur sonucu bozulmaz.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fiyat.yml/enable"
