name: Fiyat güncelle

on:
  schedule:
    # Asıl turlar sabah 10:00 ve öğlen 14:30 (Türkiye). Tur birkaç dakika sürdüğü ve GitHub zamanlayıcısı saat başı / yarım saatlerde
    # geç başlatabildiği için turlar 5 dakika ÖNCE başlar (09:55 ve 14:25): veri 10:00 ve 14:30'da güncel olur.
    # Her turun 30 dakika sonrasına YEDEK tur konur (10:25 ve 14:55). Yedek tur, son 2 saatte başarılı tur varsa kendiliğinden
    # atlanır (kredi harcamaz); asıl tur çalışmadıysa ya da başarısız olduysa onun yerine çalışır. (UTC = Türkiye - 3 saat)
    - cron: '55 6 * * *'   # 09:55 (Türkiye) -> 10:00 turu
    - cron: '25 7 * * *'   # 10:25 yedek
    - cron: '25 11 * * *'  # 14:25 (Türkiye) -> 14:30 turu
    - cron: '55 11 * * *'  # 14:55 yedek
  workflow_dispatch:
    inputs:
      force:
        description: 'Deneme turu: günlük sınırı yoksay (kredi harcar, ama 10:00 / 14:30 turlarının hakkından düşmez)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # zamanlayıcının 60 gün hareketsizlikten kapanmasını önlemek için (aşağıdaki 'Canlı tut' adımı)

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testler
        run: node --test "test/*.test.mjs"
      - name: Fiyatları topla
        env:
          REEFAPI_KEY: ${{ secrets.REEFAPI_KEY }}
        run: node collect.mjs ${{ inputs.force && '--force' || '' }}
      - name: Kaydet
        if: always()
        run: |
          git config user.name "mapp-fiyat-bot"
          git config user.email "mapp-fiyat-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "Fiyatlar güncellendi" && { git push || { git pull --rebase -X theirs && git push; }; }; }
      - name: Zamanlayıcıyı canlı tut
        # GitHub, herkese açık depoda 60 gün etkinlik olmazsa zamanlanmış çalışmaları kapatır.
        # Bu adım her turda iş akışını "etkinleştir" API'siyle yeniler; sayaç sıfırlanır. Başarısız olsa bile tur sonucu bozulmaz.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fiyat.yml/enable"
