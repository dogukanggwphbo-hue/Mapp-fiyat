name: Fiyat güncelle

on:
  schedule:
    # Günde 1 tur: öğlen 14:00 (Türkiye). Tur birkaç dakika sürdüğü ve GitHub zamanlayıcısı saat başı / yarım saatlerde
    # geç başlatabildiği için tur 5 dakika ÖNCE başlar (13:55): veri 14:00'te güncel olur.
    # 30 dakika sonrasına YEDEK tur konur (14:25 -> 14:30). Yedek tur, son 6 saatte başarılı tur varsa kendiliğinden atlanır
    # (kredi harcamaz); asıl tur çalışmadıysa ya da başarısız olduysa onun yerine çalışır. (UTC = Türkiye - 3 saat)
    - cron: '55 10 * * *'  # 13:55 (Türkiye) -> 14:00 turu
    - cron: '25 11 * * *'  # 14:25 yedek -> 14:30
  workflow_dispatch:
    inputs:
      force:
        description: 'Deneme turu: günlük sınırı yoksay (kredi harcar, ama 14:00 turunun hakkından düşmez)'
        type: boolean
        default: false
      key_slot:
        description: 'Anahtar: auto = normal sıra (1. anahtar, bitince 2.); 2 veya 3 = yalnızca o yedek anahtarla dene (yedeğe geçilmez)'
        type: choice
        options: [auto, '2', '3']
        default: auto

permissions:
  contents: write
  actions: write   # zamanlayıcının 60 gün hareketsizlikten kapanmasını önlemek için (aşağıdaki 'Canlı tut' adımı)

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testler
        run: node --test "test/*.test.mjs"
      - name: Fiyatları topla
        env:
          REEFAPI_KEY: ${{ secrets.REEFAPI_KEY }}
          REEFAPI_KEY_2: ${{ secrets.REEFAPI_KEY_2 }}   # isteğe bağlı yedek anahtarlar: ilki biterse/geçersizse otomatik devreye girer
          REEFAPI_KEY_3: ${{ secrets.REEFAPI_KEY_3 }}
          REEFAPI_ONLY: ${{ inputs.key_slot == 'auto' && '' || inputs.key_slot }}
        run: node collect.mjs ${{ inputs.force && '--force' || '' }}
      - name: Kaydet
        if: always()
        run: |
          git config user.name "mapp-fiyat-bot"
          git config user.email "mapp-fiyat-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || { git commit -m "Fiyatlar güncellendi" && { git push || { git pull --rebase -X theirs && git push; }; }; }
      - name: Zamanlayıcıyı canlı tut
        # GitHub, herkese açık depoda 60 gün etkinlik olmazsa zamanlanmış çalışmaları kapatır.
        # Bu adım her turda iş akışını "etkinleştir" API'siyle yeniler; sayaç sıfırlanır. Başarısız olsa bile tur sonucu bozulmaz.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/fiyat.yml/enable"
